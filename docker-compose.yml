version: '3.8'
services:
  app:
    build: .
    container_name: gym-app
    env_file:
      - .env.docker
    volumes:
      - .:/var/www
    networks:
      - gym-net

  db:
    image: mysql:8.0
    container_name: gym-db
    environment:
      MYSQL_DATABASE: rutinas_gimnas
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - gym-net

  webserver:
    image: nginx:alpine
    container_name: gym-webserver
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gym-net

networks:
  gym-net:
    driver: bridge

volumes:
  dbdata:
